[project]
name = "xfm-ssrl-tegel"
version = "0.1.0"
description = "SSRL XFM incarnation of Tegel: dataserver, dashboard, and actions."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["etl", "dataserver", "dash", "actions", "compute"]

[tool.uv.sources]
tegel-core = { path = "../tegel/tegel-core", editable = true }
tegel-dataserver = { path = "../tegel/tegel-base/packages/dataserver", editable = true }
tegel-actions = { path = "../tegel/tegel-base/packages/actions", editable = true }
tegel-register = { path = "../tegel/tegel-register", editable = true }
tegel-xfm = { workspace = true }
tegel-xfm-dash = { workspace = true }
tegel-xfm-actions = { workspace = true }
xfm-ssrl-etl = { workspace = true }
tegel-xfm-compute = { workspace = true }
tegel-actionserver = { path = "../tegel/tegel-actionserver", editable = true }
aims-leaf = { git = "https://github.com/lambda-ber/aims-leaf" }

[dependency-groups]
dev = [
    "xfm-ssrl-etl",
    "tegel-xfm-compute",
    "aims-leaf; python_version >= '3.12'",
    "ome-zarr-models",
    "pydantic-zarr<0.9",
    "tegel-xfm",
    "tegel-xfm-dash",
    "tegel-xfm-actions",
    "tegel-dataserver",
    "tegel-actions",
    "pytest>=8",
    "ruff>=0.8",
    "httpx",
    "zarr",
]

[tool.pytest.ini_options]
testpaths = ["etl/tests", "dataserver/tests", "actions/tests", "compute/tests", "dash/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["etl/src", "etl/tests", "dataserver/src", "dataserver/tests", "dash/src", "dash/tests", "actions/src", "actions/tests", "compute/src", "compute/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tegel"]
