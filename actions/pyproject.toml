[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tegel-xfm-actions"
version = "0.2.0"
description = "Actions for the SSRL XFM incarnation: stage processed records and serve them."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["tegel-core", "tegel-xfm", "tegel-dataserver", "tegel-actions", "httpx", "uvicorn"]

[project.scripts]
tegel-xfm = "tegel.xfm.actions.serve:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/tegel"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
